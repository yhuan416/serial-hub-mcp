<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>serial-hub-mcp · 串口调试</title>
    <link rel="stylesheet" href="/vendor/xterm.css" />
    <style>
:root {
        color-scheme: dark;
        --bg: #0a0d12;
        --bg-deep: #070a0f;
        --panel: #101620;
        --panel-2: #151d29;
        --panel-3: #1b2532;
        --border: #243142;
        --border-soft: #1a2330;
        --text: #dbe3ee;
        --muted: #8b99ad;
        --muted-2: #63718a;
        --rx: #5fd497;
        --tx: #6aa9ff;
        --err: #ff7070;
        --warn: #f0b429;
        --accent: #f0b429;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      }
      * {
        box-sizing: border-box;
      }
      /* [hidden] 必须压过后面任何 display 声明，否则 .actions{display:flex} 会让
         “终端/日志”两组按钮同时出现（两个清屏）。 */
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }
      button,
      select,
      input {
        font: inherit;
      }
      ::selection {
        background: rgba(240, 180, 41, 0.28);
      }
      :focus-visible {
        outline: 2px solid rgba(240, 180, 41, 0.55);
        outline-offset: 1px;
      }

      /* ── 顶栏 ─────────────────────────────────────── */
      header.top {
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 46px;
        padding: 0 16px;
        background: linear-gradient(180deg, #131a24, var(--panel));
        border-bottom: 1px solid var(--border);
      }
      header.top h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
        letter-spacing: 0.2px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .spacer {
        flex: 1;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted-2);
        flex: none;
      }
      .dot.on {
        background: var(--rx);
        box-shadow: 0 0 0 3px rgba(95, 212, 151, 0.15);
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .clock {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }

      /* ── 按钮 / 徽标 ──────────────────────────────── */
      button {
        color: var(--text);
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 10px;
        cursor: pointer;
        transition:
          background 0.12s ease,
          border-color 0.12s ease,
          color 0.12s ease;
      }
      button:hover {
        background: var(--panel-3);
        border-color: #33465c;
      }
      button:active {
        transform: translateY(1px);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
        transform: none;
      }
      .btn.ghost {
        background: transparent;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 22px;
        padding: 0 9px;
        border: 1px solid var(--border-soft);
        border-radius: 999px;
        background: var(--panel-2);
        color: var(--muted);
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .chip.rx {
        color: var(--rx);
        border-color: rgba(95, 212, 151, 0.28);
        background: rgba(95, 212, 151, 0.08);
      }
      .chip.tx {
        color: var(--tx);
        border-color: rgba(106, 169, 255, 0.28);
        background: rgba(106, 169, 255, 0.08);
      }
      .chip.warn {
        color: var(--warn);
        border-color: rgba(240, 180, 41, 0.28);
        background: rgba(240, 180, 41, 0.08);
      }
      .chip.err {
        color: var(--err);
        border-color: rgba(255, 112, 112, 0.3);
        background: rgba(255, 112, 112, 0.08);
      }

      .banner {
        display: none;
        flex: none;
        padding: 6px 16px;
        background: rgba(255, 107, 107, 0.12);
        color: var(--err);
        border-bottom: 1px solid rgba(255, 107, 107, 0.35);
        font-size: 12.5px;
      }
      .banner.show {
        display: block;
      }
      main {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      /* ── 标签栏 ───────────────────────────────────── */
      .tabbar {
        position: relative;
        z-index: 6;
        flex: none;
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 8px 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      .tabs-wrap {
        flex: 1;
        min-width: 0;
      }
      /* 连接多时换成两行，避免 16 个标签全挤成 “/dev/t…” 还要横向滚动。 */
      .tabs {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        max-height: 68px;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        scrollbar-color: #26313f transparent;
      }
      .tabs::-webkit-scrollbar {
        width: 8px;
      }
      .tabs::-webkit-scrollbar-thumb {
        background: #26313f;
        border-radius: 8px;
      }
      .tab {
        position: relative;
        flex: 0 1 auto;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: 84px;
        max-width: 210px;
        height: 30px;
        padding: 0 4px 0 9px;
        overflow: hidden;
        white-space: nowrap;
        color: var(--muted);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 8px;
        font-family: var(--mono);
        font-size: 12px;
        cursor: pointer;
        user-select: none;
      }
      .tab:hover {
        color: var(--text);
        background: var(--panel-2);
      }
      .tab.active {
        color: var(--text);
        background: var(--bg-deep);
        border-color: var(--border);
        box-shadow:
          inset 2px 0 0 var(--accent),
          0 2px 10px rgba(0, 0, 0, 0.35);
      }
      .tab .tab-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tab .tab-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--rx);
        flex: none;
      }
      .tab.closed {
        color: var(--muted-2);
      }
      .tab.closed .tab-dot {
        background: var(--muted-2);
      }
      .tab .unread {
        display: none;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        flex: none;
      }
      .tab.unread .unread {
        display: inline-block;
      }
      .tab-x {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 14px;
        height: 16px;
        flex: none;
        padding: 0;
        border: none;
        border-radius: 4px;
        background: transparent;
        color: var(--muted-2);
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        opacity: 0;
        transition:
          opacity 0.12s ease,
          background 0.12s ease,
          color 0.12s ease;
      }
      .tab:hover .tab-x,
      .tab.active .tab-x,
      .tab:focus-within .tab-x {
        opacity: 1;
      }
      .tab-x:hover {
        background: rgba(255, 112, 112, 0.16);
        border-color: transparent;
        color: var(--err);
      }
      .tab-x:focus-visible {
        opacity: 1;
      }
      @media (hover: none) {
        .tab-x {
          opacity: 1;
        }
      }
      .picker-btn {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 32px;
        padding: 0 10px;
        color: var(--muted);
      }
      .picker-btn:hover {
        color: var(--text);
      }
      .picker-btn .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 9px;
        background: var(--panel-3);
        color: var(--muted);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      .picker {
        position: absolute;
        top: calc(100% - 4px);
        right: 12px;
        z-index: 30;
        display: flex;
        flex-direction: column;
        width: min(380px, calc(100vw - 24px));
        max-height: min(60vh, 520px);
        overflow: hidden;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
      }
      .picker-head {
        display: flex;
        gap: 6px;
        padding: 8px;
        border-bottom: 1px solid var(--border-soft);
      }
      .picker-head input {
        flex: 1;
        min-width: 0;
        padding: 5px 9px;
        color: var(--text);
        background: var(--bg-deep);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .picker-head input::placeholder {
        color: var(--muted-2);
      }
      .picker-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 4px;
      }
      .picker-list::-webkit-scrollbar {
        width: 10px;
      }
      .picker-list::-webkit-scrollbar-thumb {
        background: #26313f;
        border: 3px solid transparent;
        background-clip: content-box;
        border-radius: 8px;
      }
      .picker-item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 7px 8px;
        text-align: left;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 7px;
        cursor: pointer;
      }
      .picker-item:hover {
        background: var(--panel-3);
        border-color: transparent;
      }
      .picker-item.active {
        background: rgba(240, 180, 41, 0.08);
        border-color: rgba(240, 180, 41, 0.35);
      }
      .picker-item .pi-main {
        flex: 1;
        min-width: 0;
      }
      .picker-item .pi-name {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--text);
        font-family: var(--mono);
        font-size: 12.5px;
      }
      .picker-item .pi-sub {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--muted);
        font-size: 11.5px;
      }
      .picker-item .pi-io {
        display: flex;
        flex: none;
        gap: 4px;
        font-size: 11px;
      }
      .picker-item .pi-io .chip {
        height: 20px;
        padding: 0 7px;
        font-size: 11px;
      }
      .picker-item .pi-x {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        flex: none;
        padding: 0;
        border: none;
        border-radius: 4px;
        background: transparent;
        color: var(--muted-2);
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        opacity: 0;
        transition:
          opacity 0.12s ease,
          background 0.12s ease,
          color 0.12s ease;
      }
      .picker-item:hover .pi-x,
      .picker-item:focus-within .pi-x {
        opacity: 1;
      }
      .picker-item .pi-x:hover {
        background: rgba(255, 112, 112, 0.16);
        border-color: transparent;
        color: var(--err);
      }
      @media (hover: none) {
        .picker-item .pi-x {
          opacity: 1;
        }
      }
      .picker-foot {
        padding: 6px 10px 8px;
        border-top: 1px solid var(--border-soft);
      }
      .picker-empty {
        padding: 18px 10px;
        color: var(--muted);
        text-align: center;
        font-size: 12.5px;
      }

      /* ── 终端区 ───────────────────────────────────── */
      .terminal {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: var(--bg-deep);
      }
      .toolbar {
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px 14px;
        padding: 8px 12px;
        background: var(--panel-2);
        border-bottom: 1px solid var(--border);
        flex-wrap: wrap;
      }
      .conn {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        flex-wrap: wrap;
      }
      .conn-name {
        max-width: 44vw;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: var(--mono);
        font-weight: 650;
        letter-spacing: 0.2px;
      }
      .chips {
        display: flex;
        align-items: center;
        gap: 5px;
        flex-wrap: wrap;
      }
      .toolbar-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-left: auto;
        flex-wrap: wrap;
      }
      .vsep {
        width: 1px;
        height: 18px;
        background: var(--border);
      }
      .segmented {
        display: inline-flex;
        gap: 2px;
        padding: 2px;
        background: var(--bg-deep);
        border: 1px solid var(--border);
        border-radius: 7px;
      }
      .seg {
        padding: 3px 12px;
        color: var(--muted);
        background: transparent;
        border: none;
        border-radius: 5px;
      }
      .seg:hover {
        color: var(--text);
        background: var(--panel-3);
        border-color: transparent;
      }
      .seg.active {
        color: var(--text);
        background: var(--panel-3);
        box-shadow: inset 0 0 0 1px var(--border);
      }
      .actions {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .field {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .field select,
      .send select {
        padding: 4px 6px;
        color: var(--text);
        background: var(--bg-deep);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 12.5px;
      }
      .views {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      .view {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .term-stack {
        position: relative;
        flex: 1;
        min-height: 0;
        margin: 6px 8px;
      }
      .term-hint {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        color: var(--muted);
        font-size: 12.5px;
        font-style: italic;
      }
      .term-host {
        position: absolute;
        inset: 0;
      }
      .term-host .xterm {
        height: 100%;
      }
      /* xterm.css 默认给 viewport 刷黑底，未铺满的最后几像素会露出黑边。 */
      .xterm .xterm-viewport {
        background-color: var(--bg-deep);
        scrollbar-width: thin;
        scrollbar-color: #26313f transparent;
      }
      .log {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 10px 14px;
        background: var(--bg-deep);
        font-family: var(--mono);
        font-size: 12.5px;
        line-height: 1.6;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .log::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      .log::-webkit-scrollbar-thumb {
        background: #26313f;
        border: 3px solid transparent;
        background-clip: content-box;
        border-radius: 8px;
      }
      .line .ts {
        color: var(--muted-2);
        font-variant-numeric: tabular-nums;
      }
      .line .dir {
        margin-right: 2px;
        font-weight: 700;
      }
      .line.rx .dir {
        color: var(--rx);
      }
      .line.tx .dir {
        color: var(--tx);
      }
      .line.sys .txt {
        color: var(--muted);
        font-style: italic;
      }
      .line.err .txt {
        color: var(--err);
      }
      .hint {
        flex: none;
        padding: 4px 14px 10px;
        color: var(--muted);
        font-size: 12.5px;
        font-style: italic;
      }
      .send {
        flex: none;
        display: flex;
        gap: 8px;
        padding: 8px 12px;
        background: var(--panel-2);
        border-top: 1px solid var(--border);
      }
      .send input[type="text"] {
        flex: 1;
        min-width: 140px;
        padding: 7px 10px;
        color: var(--text);
        background: var(--bg-deep);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-family: var(--mono);
      }
      .send input[type="text"]::placeholder {
        color: var(--muted-2);
      }
      .send button[type="submit"] {
        padding: 6px 16px;
      }

      /* ── 空状态 / 令牌弹层 ────────────────────────── */
      .empty {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }
      .empty-card {
        max-width: 430px;
        padding: 28px 26px;
        text-align: center;
        background: var(--panel);
        border: 1px dashed var(--border);
        border-radius: 14px;
      }
      .empty-icon {
        margin-bottom: 10px;
        color: var(--accent);
        font-size: 26px;
        line-height: 1;
      }
      .empty-card h2 {
        margin: 0 0 8px;
        font-size: 15px;
      }
      .empty-card p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }
      .empty-card p + p {
        margin-top: 6px;
      }
      .empty-card code {
        padding: 1px 5px;
        background: var(--panel-3);
        border: 1px solid var(--border);
        border-radius: 4px;
        font-family: var(--mono);
        font-size: 12px;
      }
      .overlay.hidden {
        display: none;
      }
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(4, 7, 11, 0.8);
        backdrop-filter: blur(3px);
      }
      .overlay form {
        width: min(420px, 100%);
        padding: 22px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      }
      .overlay h2 {
        margin: 0 0 6px;
        font-size: 16px;
      }
      .overlay p {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 13px;
      }
      .overlay input {
        width: 100%;
        padding: 9px 11px;
        color: var(--text);
        background: var(--bg-deep);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .overlay .row {
        display: flex;
        justify-content: flex-end;
        margin-top: 14px;
      }

      @media (max-width: 720px) {
        header.top {
          padding: 0 10px;
        }
        .tabbar {
          padding: 6px 8px;
        }
        .tab {
          min-width: 88px;
        }
        .toolbar {
          gap: 8px;
          padding: 8px;
        }
        .conn-name {
          max-width: 100%;
        }
        .toolbar-actions {
          width: 100%;
          margin-left: 0;
        }
        .picker {
          right: 8px;
        }
      }
    </style>
  </head>
<body>
    <header class="top">
      <div class="brand">
        <span class="dot" id="live-dot"></span>
        <h1>serial-hub-mcp</h1>
        <span class="chip" id="conn-count">0 个连接</span>
      </div>
      <span class="spacer"></span>
      <span class="clock muted small" id="clock"></span>
      <button type="button" id="token-btn" class="btn ghost small" title="设置访问令牌">令牌</button>
    </header>

    <div class="banner" id="banner"></div>

    <main>
      <nav class="tabbar" id="tabbar" hidden>
        <div class="tabs-wrap" id="tabs-wrap">
          <div class="tabs" id="tabs" role="tablist" aria-label="串口连接"></div>
        </div>
        <button
          type="button"
          class="btn ghost picker-btn"
          id="picker-btn"
          title="所有连接（Alt+K）"
          aria-expanded="false"
        >
          全部<span class="badge" id="picker-count">0</span>
        </button>
        <div class="picker" id="picker" hidden>
          <div class="picker-head">
            <input
              type="text"
              id="picker-filter"
              placeholder="过滤端口 / 连接 ID…"
              autocomplete="off"
              spellcheck="false"
            />
            <button type="button" class="btn ghost small" id="picker-close" title="关闭（Esc）">
              ✕
            </button>
          </div>
          <div class="picker-list" id="picker-list" role="listbox" aria-label="连接列表"></div>
          <div class="picker-foot muted small">↑ ↓ 选择 · Enter 切换 · Esc 关闭</div>
        </div>
      </nav>

      <section class="terminal" id="terminal" hidden>
        <div class="toolbar">
          <div class="conn">
            <span class="conn-name" id="active-title"></span>
            <div class="chips" id="active-meta"></div>
          </div>
          <div class="toolbar-actions">
            <div class="segmented" role="group" aria-label="视图">
              <button type="button" class="seg active" id="mode-term" data-mode="term">终端</button>
              <button type="button" class="seg" id="mode-log" data-mode="log">日志</button>
            </div>
            <span class="vsep"></span>
            <span class="actions group-term">
              <label class="field" title="Enter 发送的换行">
                Enter
                <select id="enter-mode">
                  <option value="cr">CR</option>
                  <option value="crlf">CRLF</option>
                  <option value="lf">LF</option>
                </select>
              </label>
              <label class="field" title="Backspace 发送的字节">
                退格
                <select id="backspace-mode">
                  <option value="del">DEL 0x7f</option>
                  <option value="bs">BS 0x08</option>
                </select>
              </label>
              <button type="button" id="term-clear-btn">清屏</button>
            </span>
            <span class="actions group-log" hidden>
              <button type="button" id="older-btn" title="从服务端缓存加载更早的数据">更早</button>
              <button type="button" id="download-btn" title="导出服务端缓存为文件">下载</button>
              <button type="button" id="pause-btn" title="暂停 / 继续接收显示">暂停</button>
              <button type="button" id="clear-btn">清屏</button>
            </span>
          </div>
        </div>
        <div class="views">
          <div class="view view-log" id="view-log" hidden>
            <div class="log" id="log" role="log" aria-live="polite"></div>
            <div class="hint" id="hint">等待数据…</div>
            <form class="send" id="send-form">
              <input
                type="text"
                id="send-input"
                placeholder="输入要发送的内容，Enter 发送"
                autocomplete="off"
                spellcheck="false"
              />
              <select id="send-newline" title="发送时追加的换行">
                <option value="crlf">CRLF</option>
                <option value="lf">LF</option>
                <option value="none">无换行</option>
              </select>
              <button type="submit" id="send-btn">发送</button>
            </form>
          </div>
          <div class="view view-term" id="view-term">
            <div class="term-stack" id="term-stack">
              <div class="term-hint" id="term-hint" hidden>连接已打开，等待数据…</div>
            </div>
          </div>
        </div>
      </section>

      <div class="empty" id="empty">
        <div class="empty-card">
          <div class="empty-icon">⌁</div>
          <h2>还没有打开的串口</h2>
          <p>用 MCP 工具 <code>open</code> 打开一个串口，这里会自动出现。</p>
          <p class="muted small">连接建立后，页面会为它新开一个标签页。</p>
        </div>
      </div>
    </main>

    <div class="overlay hidden" id="token-overlay">
      <form id="token-form">
        <h2>需要访问令牌</h2>
        <p>服务设置了 SERIAL_HUB_MCP_HTTP_TOKEN，请输入 Bearer token。</p>
        <input type="password" id="token-input" placeholder="token" autocomplete="off" />
        <div class="row"><button type="submit">保存并重试</button></div>
      </form>
    </div>

    <script type="module">
      import { Terminal } from "/vendor/xterm.mjs";
      import { FitAddon } from "/vendor/addon-fit.mjs";

      (() => {
        const TOKEN_KEY = "serial-hub-mcp-token";
        const PREFS_KEY = "serial-hub-mcp-prefs";
        const MAX_LINES = 10000;
        const MAX_HISTORY = 5000;
        const MAX_DOM = MAX_LINES + MAX_HISTORY;
        const HISTORY_LIMIT = 500;
        const tabsEl = document.getElementById("tabs");
        const tabbarEl = document.getElementById("tabbar");
        const pickerBtn = document.getElementById("picker-btn");
        const pickerCountEl = document.getElementById("picker-count");
        const pickerEl = document.getElementById("picker");
        const pickerListEl = document.getElementById("picker-list");
        const pickerFilterEl = document.getElementById("picker-filter");
        const pickerCloseBtn = document.getElementById("picker-close");
        const terminalEl = document.getElementById("terminal");
        const viewLogEl = document.getElementById("view-log");
        const viewTermEl = document.getElementById("view-term");
        const termStackEl = document.getElementById("term-stack");
        const termHintEl = document.getElementById("term-hint");
        const modeTermBtn = document.getElementById("mode-term");
        const modeLogBtn = document.getElementById("mode-log");
        const logActionsEl = document.querySelector(".group-log");
        const termActionsEl = document.querySelector(".group-term");
        const enterModeEl = document.getElementById("enter-mode");
        const backspaceModeEl = document.getElementById("backspace-mode");
        const termClearBtn = document.getElementById("term-clear-btn");
        const emptyEl = document.getElementById("empty");
        const bannerEl = document.getElementById("banner");
        const countEl = document.getElementById("conn-count");
        const dotEl = document.getElementById("live-dot");
        const clockEl = document.getElementById("clock");
        const logEl = document.getElementById("log");
        const hintEl = document.getElementById("hint");
        const titleEl = document.getElementById("active-title");
        const metaEl = document.getElementById("active-meta");
        const pauseBtn = document.getElementById("pause-btn");
        const clearBtn = document.getElementById("clear-btn");
        const olderBtn = document.getElementById("older-btn");
        const downloadBtn = document.getElementById("download-btn");
        const sendForm = document.getElementById("send-form");
        const sendInput = document.getElementById("send-input");
        const sendNewline = document.getElementById("send-newline");
        const sendBtn = document.getElementById("send-btn");
        const overlay = document.getElementById("token-overlay");
        const tokenInput = document.getElementById("token-input");

        /** @type {Map<string, any>} */
        const conns = new Map();
        let activeId = null;
        let lastTabSig = "";
        let tokenPrompted = false;
        let refreshing = false;

        function token() {
          return localStorage.getItem(TOKEN_KEY) || "";
        }

        function authHeaders() {
          const t = token();
          return t ? { Authorization: `Bearer ${t}` } : {};
        }

        function showTokenPrompt() {
          if (tokenPrompted) return;
          tokenPrompted = true;
          overlay.classList.remove("hidden");
          tokenInput.focus();
        }

        function showBanner(msg) {
          bannerEl.textContent = msg || "";
          bannerEl.classList.toggle("show", Boolean(msg));
        }

        async function api(path, opts = {}) {
          const res = await fetch(path, {
            ...opts,
            headers: {
              ...(opts.body ? { "content-type": "application/json" } : {}),
              ...authHeaders(),
              ...(opts.headers || {}),
            },
          });
          if (res.status === 401) {
            showTokenPrompt();
            throw new Error("需要访问令牌");
          }
          let data = null;
          try {
            data = await res.json();
          } catch (_) {
            /* non-json */
          }
          if (!res.ok || (data && data.ok === false)) {
            const msg =
              (data && data.error && data.error.message) || `${res.status} ${res.statusText}`;
            throw new Error(msg);
          }
          return data ? (data.response ?? data) : {};
        }

        /**
         * 直接调 MCP 工具。老版本服务端没有 /api/close，但 /mcp 一直有 close 工具，
         * 这样页面升级后不必重启服务端也能关闭连接。
         */
        async function callMcpTool(name, args) {
          const res = await fetch("/mcp", {
            method: "POST",
            headers: {
              "content-type": "application/json",
              accept: "application/json, text/event-stream",
              ...authHeaders(),
            },
            body: JSON.stringify({
              jsonrpc: "2.0",
              id: Date.now(),
              method: "tools/call",
              params: { name, arguments: args },
            }),
          });
          if (res.status === 401) {
            showTokenPrompt();
            throw new Error("需要访问令牌");
          }
          const contentType = res.headers.get("content-type") || "";
          let payload = null;
          if (contentType.includes("text/event-stream")) {
            const text = await res.text();
            const line = text.split("\n").find((l) => l.startsWith("data:"));
            payload = line ? JSON.parse(line.slice(5).trim()) : null;
          } else {
            payload = await res.json().catch(() => null);
          }
          if (!res.ok || !payload) throw new Error(`MCP ${res.status}`);
          if (payload.error) throw new Error(payload.error.message || "MCP 调用失败");
          const text = payload.result && payload.result.content && payload.result.content[0];
          if (!text || typeof text.text !== "string") return {};
          const result = JSON.parse(text.text);
          if (result && result.ok === false) {
            throw new Error((result.error && result.error.message) || "工具调用失败");
          }
          return result.response ?? result;
        }

        function fmtBytes(n) {
          n = Number(n) || 0;
          if (n < 1024) return `${n} B`;
          if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KiB`;
          return `${(n / 1024 / 1024).toFixed(2)} MiB`;
        }

        function fmtTs(ts) {
          const d = new Date(Number.isFinite(ts) ? ts : Date.now());
          const hh = String(d.getHours()).padStart(2, "0");
          const mm = String(d.getMinutes()).padStart(2, "0");
          const ss = String(d.getSeconds()).padStart(2, "0");
          const ms = String(d.getMilliseconds()).padStart(3, "0");
          return `${hh}:${mm}:${ss}.${ms}`;
        }

        function cleanText(s) {
          return String(s ?? "")
            .replace(/\r\n?/g, "\n")
            .replace(/\u001b\[[0-9;?]*[ -/]*[@-~]/g, "");
        }

        function frameText(conn) {
          const c = (conn && conn.config) || {};
          const bits = c.data_bits ?? 8;
          const parity = c.parity === "even" ? "E" : c.parity === "odd" ? "O" : "N";
          const stop = c.stop_bits ?? 1;
          const baud = c.baud_rate ?? "";
          const transport = conn.transport || "serial";
          return `${baud} ${bits}${parity}${stop} · ${transport}`;
        }

        function fullPort(conn) {
          if (!conn) return "";
          return String(
            conn.port || (conn.config && conn.config.port_id) || conn.connection_id.slice(0, 8),
          );
        }

        function tabName(conn) {
          if (!conn) return "?";
          return fullPort(conn).replace(/^\/dev\//, "");
        }

        // 同一个串口被多次 open 时标签一模一样，这里按出现顺序补 #1/#2。
        function displayNames() {
          const total = new Map();
          for (const entry of conns.values()) {
            const base = tabName(entry.status);
            total.set(base, (total.get(base) || 0) + 1);
          }
          const seen = new Map();
          const names = new Map();
          for (const [id, entry] of conns) {
            const base = tabName(entry.status);
            const n = (seen.get(base) || 0) + 1;
            seen.set(base, n);
            names.set(id, total.get(base) > 1 ? `${base} #${n}` : base);
          }
          return names;
        }

        // ── 终端（xterm）──────────────────────────────────────
        function ensureTerm(entry) {
          if (entry.term) return;
          const el = document.createElement("div");
          el.className = "term-host";
          el.hidden = false;
          termStackEl.appendChild(el);
          const term = new Terminal({
            convertEol: false,
            cursorBlink: true,
            scrollback: 5000,
            fontSize: 13,
            fontFamily: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace",
            theme: {
              background: "#070a0f",
              foreground: "#dbe3ee",
              cursor: "#f0b429",
              selectionBackground: "#26334a",
            },
          });
          const fit = new FitAddon();
          term.loadAddon(fit);
          term.open(el);
          term.onData((data) => queueInput(entry, data));
          entry.term = term;
          entry.termEl = el;
          entry.fitAddon = fit;
          if (entry.termBuffer) {
            term.write(entry.termBuffer);
            entry.termBuffer = "";
          }
        }

        function updateTermHint(entry) {
          if (!entry || entry.id !== activeId) return;
          const hasData = Boolean(entry.termHadData) || Boolean(entry.termBuffer);
          termHintEl.hidden = hasData || entry.mode === "log";
        }

        function termWrite(entry, text) {
          if (!text) return;
          entry.termHadData = true;
          updateTermHint(entry);
          if (entry.term) {
            entry.term.write(text);
            return;
          }
          entry.termBuffer = (entry.termBuffer || "") + text;
          if (entry.termBuffer.length > 1024 * 1024) {
            entry.termBuffer = entry.termBuffer.slice(-512 * 1024);
          }
        }

        function fitTerm(entry) {
          if (!entry || !entry.term || !entry.fitAddon) return;
          if (entry.id !== activeId || entry.mode === "log" || viewTermEl.hidden) return;
          try {
            entry.fitAddon.fit();
          } catch (_) {
            /* hidden/zero size */
          }
        }

        function mapInput(data) {
          let s = data;
          const enter = enterModeEl.value;
          if (enter === "crlf") s = s.replace(/\r(?!\n)/g, "\r\n");
          else if (enter === "lf") s = s.replace(/\r\n?/g, "\n");
          if (backspaceModeEl.value === "bs") s = s.replace(/\x7f/g, "\x08");
          return s;
        }

        function queueInput(entry, data) {
          const mapped = mapInput(data);
          if (!mapped) return;
          entry.inputQueue += mapped;
          if (entry.inputTimer) return;
          entry.inputTimer = setTimeout(() => {
            entry.inputTimer = null;
            void flushInput(entry);
          }, 10);
        }

        async function flushInput(entry) {
          if (entry.sendingInput) return;
          entry.sendingInput = true;
          try {
            while (entry.inputQueue) {
              const data = entry.inputQueue.slice(0, 4096);
              entry.inputQueue = entry.inputQueue.slice(4096);
              await api("/api/input", {
                method: "POST",
                body: JSON.stringify({ connection_id: entry.id, data, encoding: "utf8" }),
              });
            }
          } catch (err) {
            entry.inputQueue = "";
            termWrite(entry, `\r\n\x1b[31m[输入失败: ${err.message}]\x1b[0m\r\n`);
          } finally {
            entry.sendingInput = false;
            if (entry.inputQueue) queueMicrotask(() => void flushInput(entry));
          }
        }

        function applyMode(entry, focus) {
          if (!entry) return;
          const termMode = entry.mode !== "log";
          viewTermEl.hidden = !termMode;
          viewLogEl.hidden = termMode;
          termActionsEl.hidden = !termMode;
          logActionsEl.hidden = termMode;
          modeTermBtn.classList.toggle("active", termMode);
          modeLogBtn.classList.toggle("active", !termMode);
          for (const e of conns.values()) {
            if (e.termEl) e.termEl.hidden = !(e.id === activeId && termMode);
          }
          if (entry.id !== activeId) return;
          if (termMode) {
            ensureTerm(entry);
            if (entry.termEl) entry.termEl.hidden = false;
            ensureTermStream(entry);
            ensureLogStream(entry);
            updateTermHint(entry);
            requestAnimationFrame(() => {
              if (entry.id !== activeId || entry.mode === "log") return;
              fitTerm(entry);
              if (focus && entry.term) entry.term.focus();
            });
          } else {
            renderAll(entry);
            ensureLogStream(entry);
            if (focus) sendInput.focus();
          }
        }

        function setMode(mode) {
          const entry = activeEntry();
          if (!entry) return;
          entry.mode = mode === "log" ? "log" : "term";
          applyMode(entry, true);
        }

        function handleTermSse(entry, block) {
          let event = null;
          const dataLines = [];
          for (const raw of block.split("\n")) {
            if (raw.startsWith("event:")) event = raw.slice(6).trim();
            else if (raw.startsWith("data:")) dataLines.push(raw.slice(5).trim());
          }
          if (!event || !dataLines.length) return;
          let payload = null;
          try {
            payload = JSON.parse(dataLines.join("\n"));
          } catch (_) {
            payload = null;
          }
          if (event === "hello") {
            entry.status = payload && payload.status ? payload.status : entry.status;
            entry.closed = false;
            if (entry.id === activeId) updateMeta(entry);
          } else if (event === "data") {
            termWrite(entry, (payload && payload.text) || "");
          } else if (event === "closed") {
            entry.closed = true;
            termWrite(entry, "\r\n\x1b[31m[连接已关闭]\x1b[0m\r\n");
            if (entry.id === activeId) updateMeta(entry);
            if (entry.termAc) entry.termAc.abort();
          } else if (event === "overflow") {
            termWrite(entry, "\r\n\x1b[33m[终端读取过慢，正在重连…]\x1b[0m\r\n");
            entry.termForceReconnect = true;
          } else if (event === "error") {
            const msg =
              (payload && payload.error && payload.error.message) ||
              (payload && payload.message) ||
              "终端流错误";
            termWrite(entry, `\r\n\x1b[31m[${msg}]\x1b[0m\r\n`);
          }
        }

        async function openTermStream(entry) {
          if (entry.termAc) {
            try {
              entry.termAc.abort();
            } catch (_) {}
          }
          const ac = new AbortController();
          entry.termAc = ac;
          while (!ac.signal.aborted) {
            if (conns.get(entry.id) !== entry) return;
            try {
              const res = await fetch(
                `/api/terminal?connection_id=${encodeURIComponent(entry.id)}`,
                { headers: authHeaders(), signal: ac.signal },
              );
              if (res.status === 401) {
                showTokenPrompt();
                return;
              }
              if (res.status === 404) {
                entry.closed = true;
                termWrite(entry, "\r\n\x1b[31m[连接不存在]\x1b[0m\r\n");
                return;
              }
              if (!res.ok) throw new Error(`终端流 ${res.status}`);
              const reader = res.body.getReader();
              const decoder = new TextDecoder();
              let buf = "";
              while (!ac.signal.aborted) {
                const { value, done } = await reader.read();
                if (done) break;
                buf += decoder.decode(value, { stream: true });
                let idx;
                while ((idx = buf.indexOf("\n\n")) >= 0) {
                  const block = buf.slice(0, idx);
                  buf = buf.slice(idx + 2);
                  handleTermSse(entry, block);
                  if (entry.termForceReconnect) {
                    entry.termForceReconnect = false;
                    try {
                      await reader.cancel();
                    } catch (_) {}
                    break;
                  }
                }
                if (entry.termForceReconnect) break;
              }
            } catch (err) {
              if (ac.signal.aborted) return;
            }
            if (ac.signal.aborted) return;
            if (conns.get(entry.id) !== entry) return;
            await sleep(1500);
          }
        }

        function closeTermStream(entry) {
          if (!entry || !entry.termAc) return;
          try {
            entry.termAc.abort();
          } catch (_) {
            /* ignore */
          }
          entry.termAc = null;
        }

        // 只给当前标签开终端流：浏览器同域只允许 ~6 条 HTTP/1.1 连接，
        // 16 个连接各开一条 SSE 会把日志流挤到永远建立不起来。
        function ensureTermStream(entry) {
          if (!entry || entry.id !== activeId) return;
          if (!entry.termAc) void openTermStream(entry);
        }

        function closeLogStream(entry) {
          if (!entry || !entry.logAc) return;
          try {
            entry.logAc.abort();
          } catch (_) {}
          entry.logAc = null;
        }

        function ensureLogStream(entry) {
          if (!entry || entry.id !== activeId) return;
          if (!entry.logAc) void openLogStream(entry);
        }

        let metaSig = "";

        function metaChips(entry) {
          const st = entry.status || {};
          const c = st.config || {};
          const chips = [];
          const baud = c.baud_rate ?? "";
          const bits = c.data_bits ?? 8;
          const parity = c.parity === "even" ? "E" : c.parity === "odd" ? "O" : "N";
          const stop = c.stop_bits ?? 1;
          if (baud !== "") chips.push({ text: `${baud} ${bits}${parity}${stop}` });
          chips.push({ text: st.transport || "serial" });
          chips.push({ text: `RX ${fmtBytes(st.bytes_in)}`, cls: "rx" });
          chips.push({ text: `TX ${fmtBytes(st.bytes_out)}`, cls: "tx" });
          if (Number(st.rx_dropped) > 0)
            chips.push({ text: `丢弃 ${fmtBytes(st.rx_dropped)}`, cls: "warn" });
          if (st.reconnecting) chips.push({ text: "重连中", cls: "warn" });
          if (st.error) chips.push({ text: "错误", cls: "err", title: String(st.error) });
          if (entry.noise && entry.noise.bytes > 0) {
            const b = entry.noise.byte;
            const tag = Number.isFinite(b) ? ` 0x${Number(b).toString(16).padStart(2, "0")}` : "";
            chips.push({ text: `非文本 ${fmtBytes(entry.noise.bytes)}${tag}`, cls: "warn" });
          }
          if (entry.dropped > 0) chips.push({ text: `已丢 ${entry.dropped} 块`, cls: "warn" });
          if (entry.paused) chips.push({ text: "已暂停", cls: "warn" });
          if (entry.closed || st.open === false) chips.push({ text: "已关闭" });
          return chips;
        }

        function updateMeta(entry) {
          if (!entry || entry.id !== activeId) return;
          const name = nameCache.get(entry.id) || tabName(entry.status);
          const chips = metaChips(entry);
          const sig = `${name}\u0000${JSON.stringify(chips)}`;
          if (sig === metaSig) return;
          metaSig = sig;
          titleEl.textContent = name;
          titleEl.title = entry.id;
          metaEl.textContent = "";
          const frag = document.createDocumentFragment();
          for (const chip of chips) {
            const el = document.createElement("span");
            el.className = chip.cls ? `chip ${chip.cls}` : "chip";
            el.textContent = chip.text;
            if (chip.title) el.title = chip.title;
            frag.appendChild(el);
          }
          metaEl.appendChild(frag);
          document.title = `${name} · serial-hub-mcp`;
        }

        function updateHint(entry) {
          if (!entry) return;
          const empty = entry.history.length + entry.buffer.length === 0;
          hintEl.hidden = !empty;
          if (!empty) return;
          if (entry.noise && entry.noise.bytes > 0) {
            const b = entry.noise.byte;
            const tag = Number.isFinite(b)
              ? `0x${Number(b).toString(16).padStart(2, "0")}`
              : "非文本";
            hintEl.textContent = `只有非文本/空数据（${fmtBytes(entry.noise.bytes)}，${tag}），已折叠`;
          } else {
            hintEl.textContent = "等待数据…";
          }
        }

        function updateSummary() {
          const n = conns.size;
          countEl.textContent = `${n} 个连接`;
          pickerCountEl.textContent = String(n);
          pickerBtn.hidden = n < 2; // 只有一个连接时选择器没有意义
          dotEl.classList.toggle("on", n > 0);
          emptyEl.hidden = n > 0;
          terminalEl.hidden = n === 0;
          tabbarEl.hidden = n === 0;
          if (n === 0) closePicker();
          updateHint(activeEntry());
        }

        function activeEntry() {
          return activeId ? conns.get(activeId) || null : null;
        }

        let nameCache = new Map();

        // div 自己当按钮用：鼠标点击 + Enter/Space 都要能激活。
        function activateOnClick(el, fn) {
          el.addEventListener("click", fn);
          el.addEventListener("keydown", (ev) => {
            // 焦点在里面的关闭按钮上时，Enter/Space 只归按钮，不要顺带切标签。
            if (ev.target !== el) return;
            if (ev.key !== "Enter" && ev.key !== " ") return;
            ev.preventDefault();
            fn();
          });
        }

        async function closeConnection(id) {
          const entry = conns.get(id);
          if (!entry) return;
          const label = nameCache.get(id) || tabName(entry.status);
          const ok = window.confirm(
            `关闭连接 ${label}？\n\n这会断开串口，正在使用它的 MCP 客户端也会受影响。`,
          );
          if (!ok) return;
          try {
            const res = await fetch("/api/close", {
              method: "POST",
              headers: { "content-type": "application/json", ...authHeaders() },
              body: JSON.stringify({ connection_id: id }),
            });
            if (res.status === 401) {
              showTokenPrompt();
              throw new Error("需要访问令牌");
            }
            if (res.status === 404 || res.status === 405) {
              // 旧服务端没有这个接口，退回 /mcp 的 close 工具。
              await callMcpTool("close", { connection_id: id });
            } else {
              const data = await res.json().catch(() => null);
              if (!res.ok || (data && data.ok === false)) {
                const msg =
                  (data && data.error && data.error.message) || `${res.status} ${res.statusText}`;
                throw new Error(msg);
              }
            }
            closeTermStream(entry);
            closeLogStream(entry);
            await refresh();
          } catch (err) {
            showBanner(`关闭失败：${err.message}`);
          }
        }

        function syncTabs() {
          const sig = [...conns.keys()].join("|");
          if (sig !== lastTabSig) {
            lastTabSig = sig;
            tabsEl.textContent = "";
            for (const [id] of conns) {
              const tab = document.createElement("div");
              tab.className = "tab";
              tab.dataset.id = id;
              tab.setAttribute("role", "tab");
              tab.tabIndex = 0;
              const dot = document.createElement("span");
              dot.className = "tab-dot";
              const name = document.createElement("span");
              name.className = "tab-name";
              const unread = document.createElement("span");
              unread.className = "unread";
              const close = document.createElement("button");
              close.type = "button";
              close.className = "tab-x";
              close.textContent = "×";
              close.title = "关闭这个连接";
              close.setAttribute("aria-label", "关闭这个连接");
              close.addEventListener("click", (ev) => {
                ev.stopPropagation();
                void closeConnection(id);
              });
              tab.append(dot, name, unread, close);
              activateOnClick(tab, () => setActive(id, true));
              tabsEl.appendChild(tab);
              conns.get(id).tabEl = tab;
            }
            requestAnimationFrame(() => scrollActiveTab(false));
          }
          nameCache = displayNames();
          for (const [id, entry] of conns) {
            if (!entry.tabEl) continue;
            const label = nameCache.get(id) || "?";
            const name = entry.tabEl.querySelector(".tab-name");
            if (name) name.textContent = label;
            entry.tabEl.title = `${label}\n${fullPort(entry.status)}\n${frameText(entry.status)}\n${id}`;
            entry.tabEl.classList.toggle("active", id === activeId);
            entry.tabEl.classList.toggle("unread", entry.unread > 0 && id !== activeId);
            entry.tabEl.classList.toggle(
              "closed",
              Boolean(entry.closed) || (entry.status && entry.status.open === false),
            );
          }
          if (!pickerEl.hidden) renderPicker();
        }

        // 标签溢出时把当前连接滚进可视区，避免切到“看不见的标签”。
        function scrollActiveTab(smooth = true) {
          const btn = activeId ? conns.get(activeId)?.tabEl : null;
          if (!btn) return;
          const pad = 8;
          const view = tabsEl.getBoundingClientRect();
          const rect = btn.getBoundingClientRect();
          const opts = {};
          if (rect.left < view.left + pad) opts.left = tabsEl.scrollLeft + rect.left - view.left - pad;
          else if (rect.right > view.right - pad)
            opts.left = tabsEl.scrollLeft + rect.right - view.right + pad;
          if (rect.top < view.top + pad) opts.top = tabsEl.scrollTop + rect.top - view.top - pad;
          else if (rect.bottom > view.bottom - pad)
            opts.top = tabsEl.scrollTop + rect.bottom - view.bottom + pad;
          if (!Object.keys(opts).length) return;
          if (smooth) opts.behavior = "smooth";
          tabsEl.scrollTo(opts);
        }

        // ── 连接选择器（16+ 连接时的快速跳转）─────────────
        function renderPicker() {
          const q = pickerFilterEl.value.trim().toLowerCase();
          pickerListEl.textContent = "";
          let shown = 0;
          for (const [id, entry] of conns) {
            const label = nameCache.get(id) || tabName(entry.status);
            const st = entry.status || {};
            const hay = `${label} ${id} ${st.port || ""} ${st.transport || ""}`.toLowerCase();
            if (q && !hay.includes(q)) continue;
            shown += 1;
            const item = document.createElement("div");
            item.className = "picker-item";
            item.dataset.id = id;
            item.tabIndex = 0;
            item.setAttribute("role", "option");
            item.setAttribute("aria-selected", id === activeId ? "true" : "false");
            if (id === activeId) item.classList.add("active");
            const dot = document.createElement("span");
            dot.className = "dot";
            if (id === activeId && !entry.closed && st.open !== false) dot.classList.add("on");
            const main = document.createElement("span");
            main.className = "pi-main";
            const name = document.createElement("span");
            name.className = "pi-name";
            name.textContent = label;
            const sub = document.createElement("span");
            sub.className = "pi-sub";
            sub.textContent = `${frameText(st)} · ${id.slice(0, 8)}`;
            main.append(name, sub);
            const io = document.createElement("span");
            io.className = "pi-io";
            const rx = document.createElement("span");
            rx.className = "chip rx";
            rx.textContent = fmtBytes(st.bytes_in);
            const tx = document.createElement("span");
            tx.className = "chip tx";
            tx.textContent = fmtBytes(st.bytes_out);
            io.append(rx, tx);
            const close = document.createElement("button");
            close.type = "button";
            close.className = "pi-x";
            close.textContent = "×";
            close.title = "关闭这个连接";
            close.setAttribute("aria-label", "关闭这个连接");
            close.addEventListener("click", (ev) => {
              ev.stopPropagation();
              void closeConnection(id);
            });
            item.append(dot, main, io, close);
            activateOnClick(item, () => {
              setActive(id, true);
              closePicker();
            });
            pickerListEl.appendChild(item);
          }
          if (!shown) {
            const empty = document.createElement("div");
            empty.className = "picker-empty";
            empty.textContent = conns.size ? "没有匹配的连接" : "还没有连接";
            pickerListEl.appendChild(empty);
          }
        }

        function openPicker() {
          if (!conns.size) return;
          pickerEl.hidden = false;
          pickerBtn.setAttribute("aria-expanded", "true");
          pickerFilterEl.value = "";
          renderPicker();
          pickerFilterEl.focus();
        }

        function closePicker() {
          if (pickerEl.hidden) return;
          pickerEl.hidden = true;
          pickerBtn.setAttribute("aria-expanded", "false");
          pickerFilterEl.value = "";
        }

        function lineNode(item) {
          const line = document.createElement("div");
          line.className = `line ${item.kind || item.dir || "sys"}`;
          if (item.ts && item.dir) {
            const ts = document.createElement("span");
            ts.className = "ts";
            ts.textContent = `[${fmtTs(item.ts)}] `;
            const dir = document.createElement("span");
            dir.className = "dir";
            dir.textContent = item.dir === "tx" ? "TX " : "RX ";
            const txt = document.createElement("span");
            txt.className = "txt";
            txt.textContent = item.text;
            line.append(ts, dir, txt);
          } else {
            const txt = document.createElement("span");
            txt.className = "txt";
            txt.textContent = item.text;
            line.append(txt);
          }
          return line;
        }

        function renderAll(entry) {
          logEl.textContent = "";
          const frag = document.createDocumentFragment();
          for (const item of entry.history) frag.appendChild(lineNode(item));
          for (const item of entry.buffer) frag.appendChild(lineNode(item));
          logEl.appendChild(frag);
          while (logEl.childElementCount > MAX_DOM) logEl.removeChild(logEl.firstChild);
          entry.rendered = entry.buffer.length;
          logEl.scrollTop = logEl.scrollHeight;
          updateHint(entry);
        }

        function scheduleRender(entry) {
          if (entry.raf) return;
          entry.raf = requestAnimationFrame(() => {
            entry.raf = 0;
            if (entry.id !== activeId || entry.mode !== "log" || entry.paused) return;
            const nearBottom = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 48;
            const frag = document.createDocumentFragment();
            for (let i = entry.rendered; i < entry.buffer.length; i += 1) {
              frag.appendChild(lineNode(entry.buffer[i]));
            }
            entry.rendered = entry.buffer.length;
            logEl.appendChild(frag);
            while (logEl.childElementCount > MAX_DOM) logEl.removeChild(logEl.firstChild);
            if (nearBottom) logEl.scrollTop = logEl.scrollHeight;
            hintEl.hidden = true;
          });
        }

        function pushLine(entry, item) {
          entry.buffer.push(item);
          if (entry.buffer.length > MAX_LINES) {
            const drop = Math.max(entry.buffer.length - MAX_LINES, 100);
            entry.buffer.splice(0, drop);
            entry.rendered = Math.max(0, entry.rendered - drop);
            entry.dropped += drop;
          }
          if (entry.id === activeId && entry.mode === "log") updateHint(entry);
          if (entry.id === activeId && entry.mode === "log" && !entry.paused) {
            scheduleRender(entry);
          } else if (entry.id !== activeId) {
            entry.unread += 1;
            if (entry.tabEl) entry.tabEl.classList.add("unread");
          }
        }

        function setActive(id, focusInput) {
          const entry = conns.get(id);
          if (!entry) return;
          if (activeId !== id) {
            const prev = activeEntry();
            if (prev) {
              if (prev.raf) {
                cancelAnimationFrame(prev.raf);
                prev.raf = 0;
              }
              closeTermStream(prev);
              closeLogStream(prev);
            }
            activeId = id;
            entry.unread = 0;
            if (entry.tabEl) entry.tabEl.classList.remove("unread");
            pauseBtn.textContent = entry.paused ? "继续" : "暂停";
          }
          syncTabs();
          metaSig = "";
          updateMeta(entry);
          updateSummary();
          applyMode(entry, Boolean(focusInput));
          scrollActiveTab(true);
        }

        function removeEntry(id) {
          const entry = conns.get(id);
          if (!entry) return;
          closeTermStream(entry);
          closeLogStream(entry);
          if (entry.term) {
            try {
              entry.term.dispose();
            } catch (_) {}
            entry.term = null;
          }
          if (entry.termEl) {
            entry.termEl.remove();
            entry.termEl = null;
          }
          if (entry.inputTimer) clearTimeout(entry.inputTimer);
          if (entry.raf) {
            cancelAnimationFrame(entry.raf);
            entry.raf = 0;
          }
          conns.delete(id);
          if (activeId === id) {
            activeId = null;
            const next = conns.keys().next();
            if (!next.done) setActive(next.value, false);
            else {
              logEl.textContent = "";
              titleEl.textContent = "";
              metaEl.textContent = "";
              metaSig = "";
              document.title = "serial-hub-mcp · 串口调试";
            }
          }
          syncTabs();
          updateSummary();
        }

        function handleSse(entry, block) {
          let event = null;
          const dataLines = [];
          for (const raw of block.split("\n")) {
            if (raw.startsWith("event:")) event = raw.slice(6).trim();
            else if (raw.startsWith("data:")) dataLines.push(raw.slice(5).trim());
          }
          if (!event || !dataLines.length) return;
          let payload = null;
          try {
            payload = JSON.parse(dataLines.join("\n"));
          } catch (_) {
            payload = null;
          }
          if (event === "hello") {
            entry.status = payload && payload.status ? payload.status : entry.status;
            entry.closed = false;
            if (entry.id === activeId) updateMeta(entry);
            if (entry.tabEl) entry.tabEl.classList.remove("closed");
          } else if (event === "data") {
            entry.closed = false;
            const items = Array.isArray(payload && payload.items) ? payload.items : [payload];
            let rx = 0;
            let tx = 0;
            for (const item of items) {
              if (!item) continue;
              const dir = item.dir === "tx" ? "tx" : "rx";
              let text = cleanText(item.text);
              if (item.truncated) text += `\n…(+${item.truncated} bytes)`;
              pushLine(entry, { ts: item.ts, dir, text });
              if (dir === "tx") tx += Number(item.bytes) || 0;
              else rx += Number(item.bytes) || 0;
            }
            if (entry.status) {
              entry.status.bytes_in = (entry.status.bytes_in || 0) + rx;
              entry.status.bytes_out = (entry.status.bytes_out || 0) + tx;
            }
          } else if (event === "noise") {
            const n = Number(payload && payload.bytes) || 0;
            if (n > 0) {
              entry.noise = entry.noise || { bytes: 0, byte: null };
              entry.noise.bytes += n;
              if (payload && Number.isFinite(payload.byte)) entry.noise.byte = payload.byte;
              if (entry.id === activeId) {
                updateMeta(entry);
                updateHint(entry);
              }
            }
          } else if (event === "closed") {
            entry.closed = true;
            pushLine(entry, {
              kind: "sys",
              text: `连接已关闭（${fmtTs(payload && payload.ts)}）`,
            });
            if (entry.id === activeId) updateMeta(entry);
            if (entry.tabEl) entry.tabEl.classList.add("closed");
            if (entry.logAc) entry.logAc.abort();
          } else if (event === "overflow") {
            pushLine(entry, { kind: "sys", text: "页面读取过慢，正在重连…" });
            entry.forceReconnect = true;
          } else if (event === "error") {
            const msg =
              (payload && payload.error && payload.error.message) ||
              (payload && payload.message) ||
              "实时流错误";
            pushLine(entry, { kind: "err", text: msg });
          }
        }

        function sleep(ms) {
          return new Promise((r) => setTimeout(r, ms));
        }

        async function openLogStream(entry) {
          if (entry.logAc) {
            try {
              entry.logAc.abort();
            } catch (_) {}
          }
          const ac = new AbortController();
          entry.logAc = ac;
          while (!ac.signal.aborted) {
            if (conns.get(entry.id) !== entry) return;
            if (entry.id !== activeId) return;
            try {
              const res = await fetch(
                `/api/stream?connection_id=${encodeURIComponent(entry.id)}`,
                { headers: authHeaders(), signal: ac.signal },
              );
              if (res.status === 401) {
                showTokenPrompt();
                return;
              }
              if (res.status === 404) {
                entry.closed = true;
                updateMeta(entry);
                return;
              }
              if (!res.ok) throw new Error(`实时流 ${res.status}`);
              const reader = res.body.getReader();
              const decoder = new TextDecoder();
              let buf = "";
              while (!ac.signal.aborted) {
                const { value, done } = await reader.read();
                if (done) break;
                buf += decoder.decode(value, { stream: true });
                let idx;
                while ((idx = buf.indexOf("\n\n")) >= 0) {
                  const block = buf.slice(0, idx);
                  buf = buf.slice(idx + 2);
                  handleSse(entry, block);
                  if (entry.forceReconnect) {
                    entry.forceReconnect = false;
                    try {
                      await reader.cancel();
                    } catch (_) {}
                    break;
                  }
                }
                if (entry.forceReconnect) break;
              }
            } catch (err) {
              if (ac.signal.aborted) return;
            }
            if (ac.signal.aborted) return;
            if (conns.get(entry.id) !== entry) return;
            await sleep(1500);
          }
        }

        function makeEntry(conn) {
          const entry = {
            id: conn.connection_id,
            status: conn,
            history: [],
            buffer: [],
            noise: null,
            rendered: 0,
            dropped: 0,
            paused: false,
            unread: 0,
            closed: false,
            mode: "term",
            raf: 0,
            forceReconnect: false,
            tabEl: null,
            term: null,
            termEl: null,
            fitAddon: null,
            termAc: null,
            termBuffer: "",
            termHadData: false,
            termForceReconnect: false,
            logAc: null,
            inputQueue: "",
            inputTimer: null,
            sendingInput: false,
          };
          conns.set(entry.id, entry);
          return entry;
        }

        async function refresh() {
          if (refreshing) return;
          refreshing = true;
          try {
            const data = await api("/api/connections");
            const list = Array.isArray(data.connections) ? data.connections : [];
            const seen = new Set();
            for (const conn of list) {
              const id = conn.connection_id;
              if (!id) continue;
              seen.add(id);
              let entry = conns.get(id);
              if (!entry) {
                entry = makeEntry(conn);
              } else {
                entry.status = { ...(entry.status || {}), ...conn };
                if (entry.id === activeId) updateMeta(entry);
              }
            }
            for (const id of [...conns.keys()]) {
              if (!seen.has(id)) removeEntry(id);
            }
            if (!activeId && conns.size) setActive(conns.keys().next().value, false);
            syncTabs();
            updateSummary();
            showBanner("");
          } catch (err) {
            showBanner(err.message);
          } finally {
            refreshing = false;
          }
        }

        async function loop() {
          await refresh();
          setTimeout(loop, 2000);
        }

        modeTermBtn.addEventListener("click", () => setMode("term"));
        modeLogBtn.addEventListener("click", () => setMode("log"));
        enterModeEl.addEventListener("change", () => {
          savePrefs();
          const entry = activeEntry();
          if (entry && entry.term) entry.term.focus();
        });
        backspaceModeEl.addEventListener("change", () => {
          savePrefs();
          const entry = activeEntry();
          if (entry && entry.term) entry.term.focus();
        });
        termClearBtn.addEventListener("click", () => {
          const entry = activeEntry();
          if (!entry) return;
          entry.termBuffer = "";
          entry.termHadData = false;
          if (entry.term) entry.term.clear();
          updateTermHint(entry);
        });
        window.addEventListener("resize", () => {
          const entry = activeEntry();
          if (entry && entry.mode === "term") fitTerm(entry);
          scrollActiveTab(false);
        });
        if (typeof ResizeObserver !== "undefined") {
          // 工具栏换行、窗口缩放都会改变终端可视区，比 window.resize 更准。
          const ro = new ResizeObserver(() => {
            const entry = activeEntry();
            if (entry && entry.mode === "term") fitTerm(entry);
          });
          ro.observe(viewTermEl);
        }

        // 标签溢出时，纵向滚轮也能横向浏览（原生滚动条已隐藏）。
        tabsEl.addEventListener(
          "wheel",
          (ev) => {
            if (ev.ctrlKey || tabsEl.scrollWidth <= tabsEl.clientWidth) return;
            if (Math.abs(ev.deltaY) <= Math.abs(ev.deltaX)) return;
            ev.preventDefault();
            tabsEl.scrollLeft += ev.deltaY;
          },
          { passive: false },
        );
        pickerBtn.addEventListener("click", () => {
          if (pickerEl.hidden) openPicker();
          else closePicker();
        });
        pickerCloseBtn.addEventListener("click", closePicker);
        pickerFilterEl.addEventListener("input", renderPicker);
        pickerFilterEl.addEventListener("keydown", (ev) => {
          if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
            const items = [...pickerListEl.querySelectorAll(".picker-item")];
            if (!items.length) return;
            ev.preventDefault();
            items[ev.key === "ArrowDown" ? 0 : items.length - 1].focus();
            return;
          }
          if (ev.key !== "Enter") return;
          ev.preventDefault();
          const first = pickerListEl.querySelector(".picker-item");
          if (first) first.click();
        });
        pickerListEl.addEventListener("keydown", (ev) => {
          if (ev.key !== "ArrowDown" && ev.key !== "ArrowUp") return;
          const items = [...pickerListEl.querySelectorAll(".picker-item")];
          if (!items.length) return;
          ev.preventDefault();
          const idx = items.indexOf(document.activeElement);
          let next;
          if (ev.key === "ArrowDown") next = idx < 0 ? 0 : Math.min(items.length - 1, idx + 1);
          else next = idx < 0 ? items.length - 1 : Math.max(0, idx - 1);
          items[next].focus();
        });
        document.addEventListener("pointerdown", (ev) => {
          if (pickerEl.hidden) return;
          if (pickerEl.contains(ev.target) || pickerBtn.contains(ev.target)) return;
          closePicker();
        });
        document.addEventListener("keydown", (ev) => {
          if (ev.key === "Escape") {
            closePicker();
            return;
          }
          if (ev.altKey && (ev.key === "k" || ev.key === "K")) {
            ev.preventDefault();
            if (pickerEl.hidden) openPicker();
            else closePicker();
          }
        });

        pauseBtn.addEventListener("click", () => {
          const entry = activeEntry();
          if (!entry) return;
          entry.paused = !entry.paused;
          pauseBtn.textContent = entry.paused ? "继续" : "暂停";
          if (!entry.paused) renderAll(entry);
          updateMeta(entry);
        });

        clearBtn.addEventListener("click", () => {
          const entry = activeEntry();
          if (!entry) return;
          if (entry.raf) {
            cancelAnimationFrame(entry.raf);
            entry.raf = 0;
          }
          entry.history = [];
          entry.buffer = [];
          entry.noise = null;
          entry.rendered = 0;
          entry.dropped = 0;
          logEl.textContent = "";
          hintEl.textContent = "等待数据…";
          hintEl.hidden = false;
        });

        function oldestItem(entry) {
          if (entry.history.length) return entry.history[0];
          if (entry.buffer.length) return entry.buffer[0];
          return null;
        }

        async function loadOlder() {
          const entry = activeEntry();
          if (!entry || entry.loadingHistory) return;
          if (entry.history.length >= MAX_HISTORY) {
            showBanner("已到本地历史上限，清屏后可重新加载");
            return;
          }
          const room = Math.min(HISTORY_LIMIT, MAX_HISTORY - entry.history.length);
          const params = new URLSearchParams({
            connection_id: entry.id,
            limit: String(room),
          });
          const oldest = oldestItem(entry);
          if (entry.history.length && Number.isFinite(entry.history[0].seq)) {
            params.set("before_seq", String(entry.history[0].seq));
          } else if (oldest && Number.isFinite(oldest.ts)) {
            params.set("before_ts", String(oldest.ts));
          }
          entry.loadingHistory = true;
          olderBtn.disabled = true;
          try {
            const data = await api(`/api/history?${params.toString()}`);
            const items = (Array.isArray(data.entries) ? data.entries : []).map((e) => ({
              seq: e.seq,
              ts: e.ts,
              dir: e.dir === "tx" ? "tx" : "rx",
              text: cleanText(e.text),
            }));
            const seen = new Set(entry.history.map((x) => x.seq).filter((x) => x != null));
            const fresh = items.filter((x) => x.seq == null || !seen.has(x.seq));
            if (!fresh.length) {
              showBanner("没有更早的数据了");
              return;
            }
            entry.history = fresh.concat(entry.history);
            if (entry.id === activeId) {
              const frag = document.createDocumentFragment();
              for (const item of fresh) frag.appendChild(lineNode(item));
              const beforeHeight = logEl.scrollHeight;
              const beforeTop = logEl.scrollTop;
              logEl.insertBefore(frag, logEl.firstChild);
              logEl.scrollTop = beforeTop + (logEl.scrollHeight - beforeHeight);
              while (logEl.childElementCount > MAX_DOM) logEl.removeChild(logEl.firstChild);
              hintEl.hidden = true;
            }
            showBanner("");
          } catch (err) {
            showBanner(`加载历史失败：${err.message}`);
          } finally {
            entry.loadingHistory = false;
            olderBtn.disabled = false;
          }
        }

        async function download() {
          const entry = activeEntry();
          if (!entry) return;
          downloadBtn.disabled = true;
          try {
            const r = await api("/api/dump", {
              method: "POST",
              body: JSON.stringify({ connection_id: entry.id }),
            });
            const path = r.download_path || `/dumps/${r.file_id}`;
            const res = await fetch(path, { headers: authHeaders() });
            if (!res.ok) throw new Error(`下载失败 ${res.status}`);
            const blob = await res.blob();
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = r.file_id || "serial.log";
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 10000);
            pushLine(entry, {
              kind: "sys",
              text: `已导出 ${r.bytes ?? blob.size} 字节到 ${r.file_id}`,
            });
            showBanner("");
          } catch (err) {
            showBanner(`导出失败：${err.message}`);
          } finally {
            downloadBtn.disabled = false;
          }
        }

        olderBtn.addEventListener("click", () => void loadOlder());
        downloadBtn.addEventListener("click", () => void download());

        sendForm.addEventListener("submit", async (ev) => {
          ev.preventDefault();
          const entry = activeEntry();
          if (!entry) return;
          const text = sendInput.value;
          const newline = sendNewline.value;
          if (!text && newline === "none") return;
          sendBtn.disabled = true;
          try {
            await api("/api/write", {
              method: "POST",
              body: JSON.stringify({
                connection_id: entry.id,
                data: text,
                encoding: "utf8",
                newline,
              }),
            });
            sendInput.value = "";
            showBanner("");
          } catch (err) {
            pushLine(entry, { kind: "err", text: `发送失败：${err.message}` });
          } finally {
            sendBtn.disabled = false;
            sendInput.focus();
          }
        });

        document.getElementById("token-form").addEventListener("submit", (ev) => {
          ev.preventDefault();
          const v = tokenInput.value.trim();
          if (!v) return;
          localStorage.setItem(TOKEN_KEY, v);
          location.reload();
        });
        document.getElementById("token-btn").addEventListener("click", () => {
          tokenPrompted = false;
          tokenInput.value = token();
          overlay.classList.remove("hidden");
          tokenInput.focus();
        });

        function loadPrefs() {
          try {
            return JSON.parse(localStorage.getItem(PREFS_KEY) || "{}") || {};
          } catch (_) {
            return {};
          }
        }

        function savePrefs() {
          try {
            localStorage.setItem(
              PREFS_KEY,
              JSON.stringify({ enter: enterModeEl.value, backspace: backspaceModeEl.value }),
            );
          } catch (_) {
            /* 隐私模式等场景下忽略 */
          }
        }

        const prefs = loadPrefs();
        if (["cr", "crlf", "lf"].includes(prefs.enter)) enterModeEl.value = prefs.enter;
        if (["del", "bs"].includes(prefs.backspace)) backspaceModeEl.value = prefs.backspace;

        setInterval(() => {
          clockEl.textContent = fmtTs(Date.now()).slice(0, 12);
          const entry = activeEntry();
          if (entry) updateMeta(entry);
        }, 500);
        clockEl.textContent = fmtTs(Date.now()).slice(0, 12);

        loop();
      })();
    </script>
  </body>
