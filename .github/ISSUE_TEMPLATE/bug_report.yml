name: Bug report
description: Report a reproducible problem with serial-hub-mcp
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove tokens and private device identifiers before pasting logs.
        `service_info`, `get_status`, and `log_stats` are usually enough to start.

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `service_info` or the package/image version.
      placeholder: "0.3.4"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - stdio
        - Streamable HTTP
        - Docker (serial-hub-mcp)
        - x86 serial-hub-server
        - ESP32-S3 bridge
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, serial device, and whether the port is local or remote.
      placeholder: "Ubuntu 24.04, Node 22, /dev/ttyUSB0 via lab-x86"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Actual behavior and the exact tool result.
      render: text
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal sequence of MCP calls or commands.
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and status
      description: Paste `service_info`, `get_status`, `log_stats`, or `docker logs`. Tokens are masked.
      render: text
    validations:
      required: false