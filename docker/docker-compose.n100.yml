# n100 (192.168.4.50) — 讯美 wifi/dsp 两路 USB 串口
#
#   cp docker/serial-hub-server.env.example docker/serial-hub-server.env
#   # 编辑 token
#   docker compose -f docker/docker-compose.n100.yml up -d
services:
  serial-hub-server:
    image: harborcn.fujikam.com:14743/ipcs/serial-hub-server:0.1.5
    container_name: serial-hub-server
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      NODE_ENV: production
      SERIAL_HUB_SERVER_LISTEN: 0.0.0.0:7000
      SERIAL_HUB_SERVER_DATA_DIR: /data
      SERIAL_HUB_SERVER_PORTS: /dev/ttyACM
      SERIAL_HUB_SERVER_CAPTURE_LINGER_MS: "60000"
      SERIAL_HUB_SERVER_CAPTURE_MAX_BYTES: 256MiB
      SERIAL_HUB_SERVER_WINDOW_BYTES: 512KiB
      SERIAL_HUB_SERVER_MAX_WINDOW_BYTES: 2MiB
      SERIAL_HUB_SERVER_LEASE_MS: "30000"
    env_file:
      - ./serial-hub-server.env
    # 不写死 ttyACM0。绑定 /dev，按设备号放行 ttyACM/ttyUSB。
    volumes:
      - /home/yhuan/.local/share/serial-hub-server-docker:/data
      - /dev:/dev
      - /run/udev:/run/udev:ro
    device_cgroup_rules:
      - "c 166:* rmw"
      - "c 188:* rmw"
    group_add:
      - "20"
